# Local development only: Node runs on your computer; MongoDB runs in Docker.
services:
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialize once, then wait until this node is writable.
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --eval
        - >-
          try { rs.status(); }
          catch (e) {
            if (e.code !== 94) throw e;
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 40
    restart: unless-stopped

volumes:
  mongo-data:
